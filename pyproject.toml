[project]
name = "search-engine"
version = "0.0.1"
description = "Hybrid search engine from scratch: BM25 + HNSW, fused, benchmarked on BEIR"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.optional-dependencies]
baselines = [
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
]
dev = [
    "pytest>=8.0",
    "ranx>=0.3.19",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
